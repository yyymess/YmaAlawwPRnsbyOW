[project]
name = "analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "demucs>=4.0.1",
    "torch>=2.4",
    "torchaudio>=2.4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "numpy",
    "scipy",
    "matplotlib",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
